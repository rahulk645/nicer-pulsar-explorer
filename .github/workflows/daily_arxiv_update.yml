name: Daily NICER arXiv Auto-Updater

on:
  schedule:
    - cron: '0 2 * * *' # Runs daily at 02:00 UTC
  workflow_dispatch: # Allows manual triggering from GitHub UI

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai

      - name: Run arXiv Scanner & Database Updater
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/auto_update_nicer.py

      - name: Commit and Push Changes if Database Updated
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add pulsars_data.json
          git diff-index --quiet HEAD || (git commit -m "Auto-update NICER mass-radius database from arXiv scan [skip ci]" && git push)
